name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Display .NET info
        run: dotnet --info

      - name: Restore
        run: dotnet restore KnowYourAgentWebsite.slnx

      # Formatting is platform independent, so it only needs to be verified once
      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format KnowYourAgentWebsite.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build KnowYourAgentWebsite.slnx --configuration Release --no-restore

      # No Vouched keys are needed: the tests replace the Vouched API with an in-memory fake
      - name: Test
        run: dotnet test --solution KnowYourAgentWebsite.slnx --configuration Release --no-build --report-trx --results-directory TestResults

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults
          if-no-files-found: warn
